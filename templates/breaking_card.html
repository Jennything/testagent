<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>breaking_card</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px;
    height: 1350px;
    background: radial-gradient(120% 120% at 50% 0%, #4a0d14 0%, #10060a 55%, #06060a 100%);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  .card { width: 1080px; height: 1350px; padding: 72px 76px; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
  .ribbon {
    position: absolute; top: 56px; left: -8px;
    background: #FF2E4D; color: #fff; font-weight: 800; font-size: 28px;
    letter-spacing: 3px; padding: 12px 40px 12px 32px; text-transform: uppercase;
    clip-path: polygon(0 0, 100% 0, 92% 100%, 0% 100%);
  }
  .top-row { display: flex; justify-content: flex-end; align-items: center; margin-top: 24px; }
  .source-pill {
    background: rgba(255, 46, 77, 0.16);
    border: 1.5px solid #FF2E4D;
    color: #FFB8C2;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.5px;
    padding: 10px 24px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 40px; }
  .headline {
    font-size: 88px;
    font-weight: 800;
    line-height: 1.06;
    color: #FFF3F4;
    letter-spacing: -1.5px;
  }
  .bullets { display: flex; flex-direction: column; gap: 22px; margin-top: 8px; }
  .bullet { display: flex; gap: 18px; align-items: flex-start; font-size: 34px; color: #FFE1E5; font-weight: 500; line-height: 1.4; }
  .bullet-dot { min-width: 14px; height: 14px; border-radius: 50%; background: #FF2E4D; margin-top: 14px; }
  .footer { display: flex; justify-content: space-between; align-items: flex-end; border-top: 1.5px solid rgba(255,255,255,0.12); padding-top: 32px; }
  .brand { font-size: 32px; font-weight: 800; color: #FFF3F4; letter-spacing: 1px; }
  .brand-sub { font-size: 24px; color: #C98E94; margin-top: 4px; }
  .date { font-size: 24px; color: #C98E94; text-align: right; }
</style>
</head>
<body>
  <div class="card">
    <div class="ribbon">Breaking</div>
    <div class="top-row">
      <div class="source-pill">{{SOURCE_LABEL}}</div>
    </div>
    <div class="body">
      <div class="headline">{{HEADLINE}}</div>
      <div class="bullets">{{BULLETS_HTML}}</div>
    </div>
    <div class="footer">
      <div>
        <div class="brand">{{BRAND_NAME}}</div>
        <div class="brand-sub">{{BRAND_HANDLE}}</div>
      </div>
      <div class="date">{{DATE}}</div>
    </div>
  </div>
</body>
</html>
