<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>news_card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; font-family: "Inter", "Segoe UI", sans-serif; overflow: hidden; background: #06060a; }

  .card { width: 1080px; height: 1350px; display: flex; flex-direction: column; }

  .photo-area {
    position: relative;
    width: 1080px;
    height: 900px;
    overflow: hidden;
    background: radial-gradient(120% 120% at 20% 10%, #24346b 0%, #0a0e1c 55%, #06060a 100%);
  }
  .photo-area .blob {
    position: absolute; width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(79,124,255,0.35) 0%, rgba(79,124,255,0) 70%);
    top: -180px; right: -220px;
  }
  .photo-area.no-photo .bg-photo { display: none; }
  .bg-photo { width: 100%; height: 100%; object-fit: cover; display: block; }

  .panel {
    width: 1080px; height: 450px; background: #0a0a0a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 44px 64px; text-align: center; gap: 20px;
  }
  .divider { width: 110px; height: 3px; background: #4F7CFF; border-radius: 2px; }
  .wordmark { display: flex; align-items: center; gap: 12px; }
  .wordmark-badge {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #4F7CFF, #7C5CFC);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: #fff; font-family: "Inter";
  }
  .wordmark-text {
    font-weight: 800; font-size: 22px; letter-spacing: 3px; color: #A9BBFF;
    text-transform: uppercase;
  }
  .headline {
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-weight: 800;
    font-size: 70px;
    line-height: 1.05;
    color: #FAFAFF;
    text-transform: uppercase;
    letter-spacing: -1.5px;
  }
  .deck {
    font-size: 30px; font-weight: 500; color: #B4B4C4; line-height: 1.4; max-width: 900px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="photo-area {{PHOTO_CLASS}}">
      <div class="blob"></div>
      {{IMAGE_TAG}}
    </div>
    <div class="panel">
      <div class="divider"></div>
      <div class="wordmark">
        <div class="wordmark-badge">AI</div>
        <div class="wordmark-text">{{BRAND_NAME}}</div>
      </div>
      <div class="headline">{{HEADLINE}}</div>
      <div class="deck">{{DECK}}</div>
    </div>
  </div>
</body>
</html>
