<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>detail_slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1350px;
    font-family: "Inter", "Segoe UI", sans-serif;
    overflow: hidden;
    background: radial-gradient(120% 90% at 85% 0%, #1b1440 0%, #0a0a12 55%, #06060a 100%);
    position: relative;
  }

  .giant-number {
    position: absolute; top: 40px; right: 56px;
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800;
    font-size: 340px; line-height: 1; color: rgba(124, 92, 252, 0.14);
    user-select: none;
  }

  .card { width: 1080px; height: 1350px; padding: 76px 80px; display: flex; flex-direction: column; position: relative; }

  .top-row { display: flex; justify-content: space-between; align-items: center; }
  .wordmark { display: flex; align-items: center; gap: 12px; }
  .wordmark-badge {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #4F7CFF, #7C5CFC);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: #fff;
  }
  .wordmark-text { font-weight: 800; font-size: 20px; letter-spacing: 2.5px; color: #A9BBFF; text-transform: uppercase; }
  .step {
    font-weight: 800; font-size: 20px; letter-spacing: 2.5px; color: #C9BBFF;
    text-transform: uppercase;
  }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 32px; }
  .point-text {
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-weight: 800; font-size: 62px; line-height: 1.12; color: #FAFAFF; letter-spacing: -1px;
  }
  .divider { width: 90px; height: 3px; background: #7C5CFC; border-radius: 2px; }
  .detail-text { font-size: 36px; font-weight: 500; color: #C9C6DE; line-height: 1.5; max-width: 900px; }

  .footer { display: flex; justify-content: space-between; align-items: center; border-top: 1.5px solid rgba(255,255,255,0.12); padding-top: 28px; }
  .brand { font-size: 26px; font-weight: 800; color: #FAFAFF; }
  .swipe { font-size: 24px; color: #8B84B5; font-weight: 600; }
</style>
</head>
<body>
  <div class="giant-number">{{DETAIL_INDEX}}</div>
  <div class="card">
    <div class="top-row">
      <div class="wordmark">
        <div class="wordmark-badge">AI</div>
        <div class="wordmark-text">{{BRAND_NAME}}</div>
      </div>
      <div class="step">{{DETAIL_INDEX}} / {{DETAIL_TOTAL}}</div>
    </div>
    <div class="body">
      <div class="point-text">{{POINT_TEXT}}</div>
      <div class="divider"></div>
      <div class="detail-text">{{DETAIL_TEXT}}</div>
    </div>
    <div class="footer">
      <div class="brand">{{BRAND_NAME}}</div>
      <div class="swipe">Swipe →</div>
    </div>
  </div>
</body>
</html>
