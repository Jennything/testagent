<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>meme_card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; font-family: "Inter", "Segoe UI", sans-serif; overflow: hidden; background: #0a0608; }

  .card { width: 1080px; height: 1350px; display: flex; flex-direction: column; position: relative; }

  .photo-area {
    position: relative;
    width: 1080px;
    height: 900px;
    overflow: hidden;
    background: radial-gradient(120% 120% at 80% 10%, #4a1a3a 0%, #170a12 55%, #0a0608 100%);
  }
  .photo-area .blob {
    position: absolute; width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,77,109,0.35) 0%, rgba(255,77,109,0) 70%);
    top: -180px; left: -220px;
  }
  .bg-photo { width: 100%; height: 100%; object-fit: cover; display: block; }

  .tag {
    position: absolute; top: 40px; left: 40px;
    background: rgba(255,210,63,0.92); color: #241900;
    font-weight: 800; font-size: 22px; letter-spacing: 2px;
    padding: 8px 20px; border-radius: 999px; text-transform: uppercase;
  }

  .panel {
    width: 1080px; height: 450px; background: #0a0a0a;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 44px 64px; text-align: center; gap: 20px;
  }
  .divider { width: 110px; height: 3px; background: #FF4D6D; border-radius: 2px; }
  .wordmark { display: flex; align-items: center; gap: 12px; }
  .wordmark-badge {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, #FF4D6D, #FFD23F);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 15px; color: #241900; font-family: "Inter";
  }
  .wordmark-text {
    font-weight: 800; font-size: 22px; letter-spacing: 3px; color: #FFC2CF;
    text-transform: uppercase;
  }
  .headline {
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-weight: 800;
    font-size: 68px;
    line-height: 1.08;
    color: #FFF6F8;
    text-transform: uppercase;
    letter-spacing: -1.5px;
  }
  .deck {
    font-size: 30px; font-weight: 500; color: #C79AA6; line-height: 1.4; max-width: 900px;
    text-transform: uppercase;
  }

  /* No photo available: drop the empty photo strip, panel fills the canvas.
     .tag lives on .card now so it still shows in this mode. */
  .card.no-photo .photo-area { display: none; }
  .card.no-photo .panel {
    height: 1350px;
    background: radial-gradient(120% 90% at 80% 0%, #401a3a 0%, #120a0e 55%, #06060a 100%);
    padding: 96px 96px; gap: 32px;
  }
  .card.no-photo .headline { font-size: 90px; }
  .card.no-photo .deck { font-size: 36px; max-width: 860px; }
</style>
</head>
<body>
  <div class="card {{PHOTO_CLASS}}">
    <div class="tag">Meme</div>
    <div class="photo-area">
      <div class="blob"></div>
      {{IMAGE_TAG}}
    </div>
    <div class="panel">
      <div class="divider"></div>
      <div class="wordmark">
        <div class="wordmark-badge">AI</div>
        <div class="wordmark-text">{{BRAND_NAME}}</div>
      </div>
      <div class="headline">{{HEADLINE}}</div>
      <div class="deck">{{DECK}}</div>
    </div>
  </div>
</body>
</html>
