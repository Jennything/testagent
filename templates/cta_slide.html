<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>cta_slide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1080px; height: 1350px;
    font-family: "Inter", "Segoe UI", sans-serif;
    overflow: hidden;
    background: radial-gradient(120% 90% at 50% 40%, #241d5e 0%, #0a0a12 60%, #06060a 100%);
    position: relative;
  }

  .card {
    width: 1080px; height: 1350px; padding: 76px 96px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 40px;
  }

  .wordmark { display: flex; align-items: center; gap: 14px; }
  .wordmark-badge {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, #4F7CFF, #7C5CFC);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 19px; color: #fff;
  }
  .wordmark-text { font-weight: 800; font-size: 26px; letter-spacing: 3px; color: #A9BBFF; text-transform: uppercase; }

  .tagline {
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-weight: 800; font-size: 78px; line-height: 1.08; color: #FAFAFF;
    letter-spacing: -1.5px; text-transform: uppercase;
  }
  .subtext { font-size: 32px; font-weight: 500; color: #B9B6D4; line-height: 1.5; max-width: 820px; }

  .cta-pill {
    margin-top: 12px;
    display: inline-flex; align-items: center; gap: 16px;
    background: linear-gradient(135deg, #4F7CFF, #7C5CFC);
    padding: 24px 48px; border-radius: 999px;
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-weight: 800; font-size: 36px; color: #fff; letter-spacing: -0.5px;
  }

  .footer-note { font-size: 24px; font-weight: 600; color: #736DA0; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <div class="card">
    <div class="wordmark">
      <div class="wordmark-badge">AI</div>
      <div class="wordmark-text">{{BRAND_NAME}}</div>
    </div>
    <div class="tagline">{{TAGLINE}}</div>
    <div class="subtext">{{SUBTEXT}}</div>
    <div class="cta-pill">Follow {{HANDLE}} →</div>
    <div class="footer-note">New carousel every day</div>
  </div>
</body>
</html>
